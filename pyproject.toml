[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-sentinel"
version = "3.0.0"
description = "Security event detection and incident analysis platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "PyYAML>=6.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
soc-sentinel = "soc_sentinel.cli:main"

[tool.pytest.ini_options]
norecursedirs = [".*", "_darcs", "build", "dist", "CVS", "venv", "node_modules", "soc-sentinel"]
