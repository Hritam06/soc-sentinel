[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-sentinel"
version = "0.1.0"
description = "Security event detection and incident analysis platform"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
soc-sentinel = "soc_sentinel.cli:main"
